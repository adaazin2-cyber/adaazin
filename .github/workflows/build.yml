name: Flutter Build

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Pilih target build'
        required: true
        default: apk
        type: choice
        options:
          - apk
          - appbundle
          - web
      fast:
        description: 'Build Android cepat tanpa shrink'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

timeout-minutes: 45

jobs:
  build:
    name: Build ${{ inputs.target }}
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ inputs.target }}
      FAST: ${{ inputs.fast }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Flutter project
        shell: bash
        run: |
          set -euo pipefail
          test -f pubspec.yaml
          test -d lib
          case "$TARGET" in
            apk|appbundle|web) ;;
            *) echo "Target tidak didukung: $TARGET"; exit 1 ;;
          esac

      - name: Setup Java 17
        if: env.TARGET != 'web'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies from pubspec.yaml
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Build Android APK
        if: env.TARGET == 'apk'
        shell: bash
        run: |
          set -euo pipefail
          EXTRA_ARGS=""
          if [ "$FAST" = "true" ]; then EXTRA_ARGS="--no-shrink"; fi
          flutter build apk --release $EXTRA_ARGS
          test -f build/app/outputs/flutter-apk/app-release.apk

      - name: Build Android App Bundle
        if: env.TARGET == 'appbundle'
        shell: bash
        run: |
          set -euo pipefail
          EXTRA_ARGS=""
          if [ "$FAST" = "true" ]; then EXTRA_ARGS="--no-shrink"; fi
          flutter build appbundle --release $EXTRA_ARGS
          test -f build/app/outputs/bundle/release/app-release.aab

      - name: Build Web
        if: env.TARGET == 'web'
        shell: bash
        run: |
          set -euo pipefail
          flutter build web --release
          test -d build/web

      - name: Collect build output
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out
          mkdir -p out
          case "$TARGET" in
            apk) cp build/app/outputs/flutter-apk/app-release.apk out/ ;;
            appbundle) cp build/app/outputs/bundle/release/app-release.aab out/ ;;
            web) cp -a build/web out/web ;;
          esac
          find out -maxdepth 3 -type f | sort

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-${{ inputs.target }}-${{ github.run_number }}
          path: out/
          if-no-files-found: error
          retention-days: 14
          
