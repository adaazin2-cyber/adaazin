name: build-apk
run-name: build ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: flutter atau web2apk
        required: true
        default: flutter
        type: string
      zip_url:
        description: (tidak dipakai, diabaikan)
        required: false
        default: ""
        type: string
      tag:
        description: Tag release tempat ZIP diupload bot
        required: true
        type: string
      build_type:
        description: release atau debug
        required: false
        default: release
        type: string
      web_url:
        description: URL website (mode web2apk)
        required: false
        default: ""
        type: string
      app_name:
        description: Nama aplikasi (mode web2apk)
        required: false
        default: WebApp
        type: string
      icon_url:
        description: URL icon (mode web2apk, opsional)
        required: false
        default: ""
        type: string

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MODE: ${{ inputs.mode }}
      TAG: ${{ inputs.tag }}
      BUILD_TYPE: ${{ inputs.build_type }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validasi input
        run: |
          if [ "$MODE" != "flutter" ]; then
            echo "Mode '$MODE' belum didukung workflow ini."
            exit 1
          fi
          if [ -z "$TAG" ]; then echo "tag kosong"; exit 1; fi
          if [ "$BUILD_TYPE" != "release" ] && [ "$BUILD_TYPE" != "debug" ]; then
            echo "build_type harus release atau debug"; exit 1
          fi

      - name: Download project dari release
        run: |
          mkdir -p download
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "*.zip" --dir download --clobber
          ZIP=$(ls download/*.zip | head -1)
          if [ -z "$ZIP" ]; then echo "ZIP tidak ditemukan di release $TAG"; exit 1; fi
          unzip -q "$ZIP" -d project

      - name: Locate pubspec
        run: |
          PUBSPEC=$(find project -name pubspec.yaml -not -path "*/build/*" | head -1)
          if [ -z "$PUBSPEC" ]; then echo "pubspec.yaml tidak ditemukan di dalam ZIP"; exit 1; fi
          echo "PROJ_DIR=$(dirname "$PUBSPEC")" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build APK
        run: |
          cd "$PROJ_DIR"
          flutter pub get
          flutter build apk --$BUILD_TYPE

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.build_type }}
          path: ${{ env.PROJ_DIR }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
