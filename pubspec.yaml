name: rizzriylix
description: Flutter application for adaazin2-cyber/adaazin.
publish_to: "none"
version: 6.0.0+1

environment:
  sdk: ">=3.8.1 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  device_info_plus: ^10.1.2
  font_awesome_flutter: ^10.8.0
  html: ^0.15.5
  http: ^1.2.2
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  shimmer: ^3.0.0
  url_launcher: ^6.3.1
  video_player: ^2.9.2
  web_socket_channel: ^3.0.1
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path_android: assets/icon/icon.jpg
  image_path_ios: assets/icon/icon/icon.jpg
  image_path: assets/icon/icon.jpg
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/icon.jpg
    - assets/images/splash.jpg
    - assets/images/bckrnd.jpg
    - assets/images/logo.png
    - assets/images/bugtitle.png
    - assets/videos/splash.mp4
    - assets/videos/landing.mp4
    - assets/videos/bug.mp4
    - assets/videos/intro.mp4
    - assets/videos/menu.mp4

  fonts:
    - family: Orbitron
      fonts:
        - asset: fonts/Orbitron-Regular.ttf
        - asset: fonts/Orbitron-Medium.ttf
        - asset: fonts/Orbitron-SemiBold.ttf
        - asset: fonts/Orbitron-Bold.ttf
        - asset: fonts/Orbitron-ExtraBold.ttf
        - asset: fonts/Orbitron-Black.ttf
    - family: ShareTechMono
      fonts:
        - asset: fonts/ShareTechMono-Regular.ttf
        
